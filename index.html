<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Check In Mental — Ruang Aman & Hangat untuk Kesehatan Mentalmu</title>

  <!-- Font Sesuai ROD: Glacial Indifference (Bold & Regular) + Handwriting Regular (Patrick Hand) -->
  <link rel="preconnect" href="https://fonts.cdnfonts.com" crossorigin />
  <link href="https://fonts.cdnfonts.com/css/glacial-indifference-2" rel="stylesheet" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Patrick+Hand&display=swap" rel="stylesheet" />

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            /* 60% Background & Turunannya */
            cream: '#FFF9F2',
            creamCard: '#FFFDF9',
            sidebarBg: '#FBF3E9',
            warmBorder: '#EFE2D3',

            /* 30% Primary & Secondary + Turunannya */
            primaryBlue: '#3E8EDE',
            primaryBlueHover: '#2F7AC6',
            softBlueBg: '#E6F1FC',
            softBlueBlob: '#DFEEFB',
            activeNavBlue: '#E2EEFA',

            secondaryTerracotta: '#C98A5A',
            secondaryHover: '#B57647',
            softSecondaryBg: '#F6EAE0',
            softSecondaryBlob: '#F3E3D6',

            /* 10% Complementary + Turunannya */
            compYellow: '#FFD166',
            softYellowBg: '#FFF5D6',
            compMint: '#A2E2C7',
            softMintBg: '#E5F7EF',

            /* Warna Teks Utama & Turunan */
            espresso: '#3A2E2E',
            mutedBrown: '#685858',
          },
          fontFamily: {
            heading: ['"Glacial Indifference"', 'sans-serif'],
            sans: ['"Glacial Indifference"', 'sans-serif'],
            hand: ['"Patrick Hand"', 'cursive'],
          },
          fontSize: {
            /* Skala Golden Ratio ROD (45 -> 28 -> 17.3 -> 11) */
            'rod-title': ['45px', { lineHeight: '1.12', letterSpacing: '-0.015em' }],
            'rod-subtitle': ['28px', { lineHeight: '1.25' }],
            'rod-body': ['17.3px', { lineHeight: '1.55' }],
            'rod-note': ['11px', { lineHeight: '1.4' }],
          },
          boxShadow: {
            softCard: '0 8px 26px rgba(58, 46, 46, 0.04)',
            softBtn: '0 4px 14px rgba(58, 46, 46, 0.06)',
            sidebar: '-4px 0 24px rgba(58, 46, 46, 0.08)',
          }
        }
      }
    };
  </script>

  <style>
    /* Variabel Golden Ratio Font sesuai ROD + Adaptif HP, Tablet/iPad, & Laptop */
    :root {
      --font-judul: 45px;
      --font-subjudul: 28px;       /* 45 ÷ 1.618 = 27.81 ≈ 28px */
      --font-body: clamp(15.5px, 2.1vw, 17.3px);
      --font-note: 11px;           /* 17.3 ÷ 1.618 = 10.69 ≈ 11px */
    }

    * {
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      background-color: #FFF9F2;
      color: #3A2E2E;
      font-family: 'Glacial Indifference', sans-serif;
      font-size: var(--font-body);
      font-weight: 400;
      overflow-x: hidden;
      scroll-behavior: smooth;
      padding-left: env(safe-area-inset-left);
      padding-right: env(safe-area-inset-right);
    }

    /* Kelas Tipografi Golden Ratio */
    .rod-judul-besar {
      font-family: 'Glacial Indifference', sans-serif;
      font-weight: 700;
      font-size: clamp(30px, 5.2vw, var(--font-judul));
      line-height: 1.14;
      color: #3A2E2E;
    }

    .rod-sub-judul {
      font-family: 'Glacial Indifference', sans-serif;
      font-weight: 700;
      font-size: clamp(20px, 3.2vw, var(--font-subjudul));
      line-height: 1.25;
      color: #3A2E2E;
    }

    .rod-body-text {
      font-family: 'Glacial Indifference', sans-serif;
      font-weight: 400;
      font-size: var(--font-body);
      line-height: 1.55;
    }

    .rod-note-text {
      font-family: 'Patrick Hand', cursive;
      font-weight: 400;
      font-size: var(--font-note);
      line-height: 1.35;
    }

    .rod-quote-hand {
      font-family: 'Patrick Hand', cursive;
      font-weight: 400;
      font-size: var(--font-body);
      line-height: 1.45;
    }

    ::-webkit-scrollbar {
      width: 7px;
      height: 7px;
    }
    ::-webkit-scrollbar-track {
      background: #FBF3E9;
    }
    ::-webkit-scrollbar-thumb {
      background: #DECBB8;
      border-radius: 999px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: #C98A5A;
    }

    @keyframes gentleFloat {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-6px); }
    }
    .animate-gentle-float {
      animation: gentleFloat 4.5s ease-in-out infinite;
    }

    @keyframes fadeSlideUp {
      from {
        opacity: 0;
        transform: translateY(10px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }
    .view-enter {
      animation: fadeSlideUp 0.32s cubic-bezier(0.22, 1, 0.36, 1) forwards;
    }

    .explore-card {
      transition: transform 0.25s cubic-bezier(0.22, 1, 0.36, 1), box-shadow 0.25s ease;
    }
    @media (hover: hover) {
      .explore-card:hover {
        transform: translateY(-5px);
        box-shadow: 0 12px 26px rgba(58, 46, 46, 0.07);
      }
    }

    .sidebar-drawer {
      transition: transform 0.32s cubic-bezier(0.22, 1, 0.36, 1), width 0.32s cubic-bezier(0.22, 1, 0.36, 1), opacity 0.25s ease;
    }

    /* Penyesuaian otomatis jika tinggi layar pendek (HP lanskap / layar kecil) agar sidebar tetap muat */
    @media (max-height: 640px) {
      #sidebar-logo-slot {
        width: 50px !important;
        height: 50px !important;
      }
      #right-sidebar .nav-item {
        padding-top: 0.35rem !important;
        padding-bottom: 0.35rem !important;
      }
      #right-sidebar .subnav-item {
        padding-top: 0.25rem !important;
        padding-bottom: 0.25rem !important;
      }
    }
  </style>
</head>
<body class="min-h-screen min-h-dvh bg-cream text-espresso selection:bg-softBlueBg selection:text-espresso">

  <!-- App Root Wrapper -->
  <div id="app" class="relative min-h-screen min-h-dvh flex flex-col lg:flex-row">

    <!-- ==================== MAIN CONTENT AREA (LEFT) ==================== -->
    <main id="main-area" class="relative flex-1 min-w-0 min-h-screen min-h-dvh overflow-x-hidden transition-all duration-300">

      <!-- Organic Pastel Background Blobs (Skala adaptif HP, Tablet, Laptop) -->
      <svg class="pointer-events-none select-none absolute -top-6 left-[28%] sm:left-[36%] w-[180px] sm:w-[270px] lg:w-[340px] h-[95px] sm:h-[125px] lg:h-[145px] z-0" viewBox="0 0 360 150" fill="none">
        <path d="M-10 -10 C 10 85, 65 135, 145 110 C 215 88, 285 45, 365 75 L 365 -10 Z" fill="#DFEEFB" />
      </svg>

      <svg class="pointer-events-none select-none absolute -top-4 right-0 w-[165px] sm:w-[250px] lg:w-[310px] h-[125px] sm:h-[180px] lg:h-[210px] z-0" viewBox="0 0 320 220" fill="none">
        <path d="M55 -10 C 25 35, 50 75, 115 95 C 175 115, 225 185, 325 175 L 325 -10 Z" fill="#F3E3D6" />
      </svg>

      <svg class="pointer-events-none select-none absolute top-[280px] sm:top-[310px] -left-6 w-[55px] sm:w-[80px] lg:w-[95px] h-[160px] sm:h-[190px] z-0" viewBox="0 0 100 200" fill="none">
        <path d="M0 10 C 55 25, 72 75, 58 125 C 46 165, 22 185, 0 195 Z" fill="#E5F7EF" />
      </svg>

      <!-- Main Inner Container -->
      <div id="main-inner" class="relative z-10 max-w-[1060px] mx-auto px-4 sm:px-8 lg:px-11 pt-4 sm:pt-6 lg:pt-7 pb-12 transition-all duration-300">

        <!-- ==================== TOP NAVBAR ==================== -->
        <header class="flex items-center justify-between gap-3 mb-5 sm:mb-7 lg:mb-8">
          <button onclick="navigateTo('beranda')" class="group flex items-center gap-2.5 sm:gap-3 text-left focus:outline-none min-h-[44px]" aria-label="Kembali ke Beranda Check In Mental">
            <div id="navbar-logo-slot" class="w-10 h-10 sm:w-12 sm:h-12 flex-shrink-0 transition-transform duration-300 group-hover:scale-105"></div>
            <span class="font-heading font-bold text-[19px] sm:text-[22px] lg:text-[23px] tracking-tight text-espresso">
              Check In Mental
            </span>
          </button>

          <div class="relative flex items-center gap-2.5">
            <!-- Mobile/Tablet Menu Label + Desktop Sidebar Toggle Button -->
            <button
              id="sidebar-toggle-btn"
              onclick="toggleSidebar()"
              class="h-10 sm:h-11 px-3 lg:px-0 lg:w-10 rounded-xl bg-creamCard shadow-softBtn border border-warmBorder flex items-center justify-center gap-2 text-espresso hover:bg-white active:scale-95 transition"
              aria-label="Buka atau Tutup Menu Samping"
              title="Menu Navigasi"
            >
              <!-- Ikon Hamburger khusus HP & Tablet (< 1024px) -->
              <svg id="sidebar-toggle-menu-icon" class="w-5 h-5 lg:hidden" viewBox="0 0 24 24" fill="none" stroke="#3A2E2E" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                <line x1="4" y1="7" x2="20" y2="7"></line>
                <line x1="4" y1="12" x2="20" y2="12"></line>
                <line x1="4" y1="17" x2="20" y2="17"></line>
              </svg>
              <span class="text-[13.5px] font-heading font-bold lg:hidden">Menu</span>

              <!-- Ikon Panah khusus Laptop/Desktop (>= 1024px) -->
              <svg id="sidebar-toggle-chevron" class="hidden lg:block w-4 h-4 transition-transform duration-300" viewBox="0 0 24 24" fill="none" stroke="#3A2E2E" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
                <polyline points="9 18 15 12 9 6"></polyline>
              </svg>
            </button>
          </div>
        </header>

        <!-- ==================== DYNAMIC VIEW CONTAINER ==================== -->
        <div id="view-container">
          <!-- Default View: Beranda -->
        </div>

      </div>
    </main>

    <!-- Mobile & Tablet Backdrop Overlay when Sidebar Drawer is open -->
    <div
      id="sidebar-backdrop"
      onclick="closeSidebarMobile()"
      class="fixed inset-0 bg-espresso/25 backdrop-blur-[1.5px] z-30 hidden lg:hidden transition-opacity"
    ></div>

    <!-- ==================== RIGHT SIDEBAR DRAWER ==================== -->
    <aside
      id="right-sidebar"
      class="sidebar-drawer fixed lg:sticky top-0 right-0 z-40 h-screen h-dvh flex-shrink-0 bg-sidebarBg shadow-sidebar border-l border-warmBorder overflow-y-auto overflow-x-hidden"
      aria-label="Navigasi Utama Check In Mental"
    >
      <div class="w-[86vw] max-w-[320px] sm:w-[325px] lg:w-[305px] xl:w-[330px] h-full min-h-full flex flex-col justify-between pb-[env(safe-area-inset-bottom)]">
        <div class="px-4 sm:px-5 pt-3 pb-2">
          <!-- Top-Right Close Button -->
          <div class="flex justify-end">
            <button
              onclick="toggleSidebar(false)"
              class="w-9 h-9 rounded-xl flex items-center justify-center text-espresso/80 hover:text-espresso hover:bg-espresso/5 active:scale-95 transition"
              aria-label="Tutup Sidebar"
              title="Tutup Menu"
            >
              <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="#3A2E2E" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                <line x1="18" y1="6" x2="6" y2="18"></line>
                <line x1="6" y1="6" x2="18" y2="18"></line>
              </svg>
            </button>
          </div>

          <!-- Centered Mascot & Uppercase Brand Header -->
          <div class="flex flex-col items-center text-center mb-3">
            <div id="sidebar-logo-slot" class="w-[66px] h-[66px] sm:w-[72px] sm:h-[72px] mb-0.5"></div>
            <h2 class="font-heading font-bold text-[16px] sm:text-[17px] tracking-[0.03em] text-espresso uppercase leading-tight">
              CHECK IN MENTAL
            </h2>
            <svg class="w-32 h-2.5 mt-0.5" viewBox="0 0 150 12" fill="none">
              <path d="M4 6 Q 18 2, 32 6 T 60 6 T 88 6 T 116 6 T 146 6" stroke="#C98A5A" stroke-width="3" stroke-linecap="round" />
            </svg>
            <div class="w-full h-[1px] bg-warmBorder mt-2.5"></div>
          </div>

          <!-- Navigation Menu List -->
          <nav class="space-y-1 text-[15px]">

            <!-- 1. Beranda -->
            <button
              data-nav="beranda"
              onclick="navigateTo('beranda')"
              class="nav-item w-full flex items-center gap-3 px-3.5 py-2.5 lg:py-2 rounded-[13px] text-left transition font-normal text-espresso hover:bg-activeNavBlue/70"
            >
              <svg class="w-[18px] h-[18px] flex-shrink-0" viewBox="0 0 24 24" fill="none" stroke="#3E8EDE" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round">
                <path d="M3 10.5L12 3l9 7.5" />
                <path d="M5 9.5V19a1.5 1.5 0 0 0 1.5 1.5h11A1.5 1.5 0 0 0 19 19V9.5" />
                <path d="M9.5 20.5v-6a1 1 0 0 1 1-1h3a1 1 0 0 1 1 1v6" />
              </svg>
              <span>Beranda</span>
            </button>

            <!-- 2. Cek Kondisi Mental -->
            <button
              data-nav="cek-kondisi"
              onclick="navigateTo('cek-kondisi')"
              class="nav-item w-full flex items-center gap-3 px-3.5 py-2.5 lg:py-2 rounded-[13px] text-left transition font-normal text-espresso hover:bg-activeNavBlue/70"
            >
              <svg class="w-[18px] h-[18px] flex-shrink-0" viewBox="0 0 24 24" fill="none" stroke="#3E8EDE" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round">
                <path d="M19.5 12.572l-7.5 7.428l-7.5 -7.428a5 5 0 1 1 7.5 -6.566a5 5 0 1 1 7.5 6.572" />
                <path d="M5 12h3.5l1.5 -3l2.5 6l1.5 -3h5" />
              </svg>
              <span>Cek Kondisi Mental</span>
            </button>

            <!-- 3. Layanan Konsultasi (Accordion) -->
            <div>
              <div class="flex items-center rounded-[13px] transition hover:bg-activeNavBlue/70" id="konsultasi-nav-wrapper">
                <button
                  data-nav="konsultasi"
                  onclick="navigateTo('konsultasi', { filter: 'Panduan' })"
                  class="nav-item flex-1 flex items-center gap-3 pl-3.5 pr-2 py-2.5 lg:py-2 rounded-l-[13px] text-left transition font-normal text-espresso"
                >
                  <svg class="w-[18px] h-[18px] flex-shrink-0" viewBox="0 0 24 24" fill="none" stroke="#3E8EDE" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M12 11.5C10.2 9.9 8 8.3 8 6.4A2.4 2.4 0 0 1 10.4 4c.8 0 1.4.4 1.6.9.2-.5.8-.9 1.6-.9A2.4 2.4 0 0 1 16 6.4c0 1.9-2.2 3.5-4 5.1z" />
                    <path d="M3 16.5h4.5l3 1.5h4c1.1 0 2-.9 2-2s-.9-2-2-2h-3.5" />
                    <path d="M3 19.5h11.5l5.5-2.5c.8-.4 1.2-1.3.8-2.1-.4-.8-1.3-1.1-2.1-.7L15 16" />
                  </svg>
                  <span>Layanan Konsultasi</span>
                </button>
                <button
                  onclick="toggleSubmenu()"
                  class="px-3 py-2.5 lg:py-2 text-espresso/80 hover:text-espresso focus:outline-none"
                  aria-label="Buka atau tutup submenu Layanan Konsultasi"
                >
                  <svg id="konsultasi-chevron" class="w-4 h-4 transition-transform duration-200" viewBox="0 0 24 24" fill="none" stroke="#3A2E2E" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                    <polyline points="6 9 12 15 18 9"></polyline>
                  </svg>
                </button>
              </div>

              <!-- Submenu -->
              <div id="konsultasi-submenu" class="relative pl-6 pr-2 pt-0.5 pb-1 space-y-0.5">

                </svg>

                <button
                  data-subnav="Konselor"
                  onclick="navigateTo('konsultasi', { filter: 'Konselor' })"

                >
                  <span class="w-2 h-2 rounded-full bg-secondaryTerracotta flex-shrink-0"></span>
                  <span>Konselor</span>
                </button>

                <button
                  data-subnav="Psikolog"
                  onclick="navigateTo('konsultasi', { filter: 'Psikolog' })"

                >
                  <span class="w-2 h-2 rounded-full bg-secondaryTerracotta flex-shrink-0"></span>
                  <span>Psikolog</span>
                </button>

                <button
                  data-subnav="Psikiater"
                  onclick="navigateTo('konsultasi', { filter: 'Psikiater' })"
                  class="subnav-item w-full flex items-center gap-2.5 pl-5 pr-3 py-2 lg:py-1.5 rounded-xl text-[14px] text-espresso/90 hover:text-espresso hover:bg-softSecondaryBg/70 transition text-left"
                >
                  <span class="w-2 h-2 rounded-full bg-secondaryTerracotta flex-shrink-0"></span>
                  <span>Psikiater</span>
                </button>
              </div>
            </div>

            <!-- 4. Rekomendasi Tempat Healing -->
            <button
              data-nav="tempat-healing"
              onclick="navigateTo('tempat-healing')"
              class="nav-item w-full flex items-center gap-3 px-3.5 py-2.5 lg:py-2 rounded-[13px] text-left transition font-normal text-espresso hover:bg-activeNavBlue/70"
            >

                <path d="M12 21s-6.5-5.6-6.5-11a6.5 6.5 0 1 1 13 0c0 5.4-6.5 11-6.5 11z" />
                <circle cx="12" cy="10" r="2.4" />
              </svg>
              <span>Rekomendasi Tempat Healing</span>
            </button>

            <!-- 5. Rekomendasi Buku -->
            <button
              data-nav="buku"
              onclick="navigateTo('buku')"
              class="nav-item w-full flex items-center gap-3 px-3.5 py-2.5 lg:py-2 rounded-[13px] text-left transition font-normal text-espresso hover:bg-activeNavBlue/70"
            >
              <svg class="w-[18px] h-[18px] flex-shrink-0" viewBox="0 0 24 24" fill="none" stroke="#3E8EDE" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round">

              <span>Rekomendasi Buku</span>

        </div>

        <!-- Bottom Motivational Cloud Badge -->
        <div class="px-4 sm:px-5 pb-4 pt-1.5">
          <div class="relative bg-softMintBg border border-compMint/60 rounded-[26px] px-4 py-2.5 text-center shadow-[inset_0_1px_0_rgba(255,255,255,0.7)]">
            <svg class="w-5 h-5 absolute top-2 right-3" viewBox="0 0 28 28" fill="none">
              <path d="M7 11 L11 4" stroke="#FFD166" stroke-width="2.4" stroke-linecap="round" />
              <path d="M12 14 L20 9" stroke="#C98A5A" stroke-width="2.2" stroke-linecap="round" />
              <path d="M14 19 L22 18" stroke="#FFD166" stroke-width="2.4" stroke-linecap="round" />
            </svg>
            <p class="font-hand text-[16px] leading-snug text-espresso">
              You're doing great!<br />
              Take care of your mind
              <svg class="inline-block w-3.5 h-3.5 ml-0.5 -mt-0.5" viewBox="0 0 24 24" fill="none" stroke="#3A2E2E" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M12 20.5C12 20.5 3.5 15 3.5 8.8C3.5 6.1 5.6 4 8.2 4C9.8 4 11.2 4.8 12 6C12.8 4.8 14.2 4 15.8 4C18.4 4 20.5 6.1 20.5 8.8C20.5 15 12 20.5 12 20.5Z" />

      </div>

  </div>

  <!-- ==================== GLOBAL INTERACTIVE MODAL & TOAST ==================== -->
  <div id="modal-overlay" class="fixed inset-0 bg-espresso/30 backdrop-blur-[2px] z-50 hidden items-center justify-center p-3.5 sm:p-5">
    <div id="modal-box" class="bg-creamCard border border-warmBorder rounded-[26px] sm:rounded-[28px] max-w-lg w-full p-5 sm:p-7 shadow-2xl relative view-enter max-h-[88dvh] overflow-y-auto">
      <button onclick="closeModal()" class="absolute top-4 right-4 sm:top-5 sm:right-5 w-9 h-9 rounded-xl bg-cream hover:bg-softSecondaryBg flex items-center justify-center text-espresso transition" aria-label="Tutup jendela">
        <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="#3A2E2E" stroke-width="2.4" stroke-linecap="round">
          <line x1="18" y1="6" x2="6" y2="18"></line>
          <line x1="6" y1="6" x2="18" y2="18"></line>
        </svg>
      </button>
      <div id="modal-content"></div>
    </div>

    /* ==========================================================================
       3. INITIALIZATION & DEVICE-RESPONSIVE NAVIGATION CONTROLLERS
    ========================================================================== */
    document.addEventListener('DOMContentLoaded', () => {
      document.getElementById('navbar-logo-slot').innerHTML = getMascotSVG({ withBackdrop: false, withExtraSparkles: false });
      document.getElementById('sidebar-logo-slot').innerHTML = getMascotSVG({ withBackdrop: false, withExtraSparkles: true });

      syncSidebarUI();
      navigateTo('beranda');

      window.addEventListener('resize', () => {
        const isNowDesktop = window.innerWidth >= 1024;
        if (isNowDesktop !== lastWasDesktop) {
          lastWasDesktop = isNowDesktop;
          state.sidebarOpen = isNowDesktop;
        }
        syncSidebarUI();
      });
    });

    function navigateTo(view, options = {}) {
      state.currentView = view;

      if (view === 'konsultasi' && options.filter) {
        state.konsultasiFilter = options.filter;
        state.submenuOpen = true;
      }

      if (window.innerWidth < 1024) {
        state.sidebarOpen = false;
        syncSidebarUI();
      }

      updateActiveNavStyles();
      renderCurrentView();
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function updateActiveNavStyles() {
      document.querySelectorAll('.nav-item').forEach((el) => {
        const navKey = el.getAttribute('data-nav');
        if (navKey === state.currentView && navKey !== 'konsultasi') {
          el.classList.add('bg-activeNavBlue', 'font-bold');
          el.classList.remove('font-normal');
        } else {
          el.classList.remove('bg-activeNavBlue', 'font-bold');
          el.classList.add('font-normal');
        }
      });

      const konsulWrapper = document.getElementById('konsultasi-nav-wrapper');
      if (state.currentView === 'konsultasi') {
        konsulWrapper.classList.add('bg-activeNavBlue');
        konsulWrapper.querySelector('.nav-item').classList.add('font-bold');
      } else {
        konsulWrapper.classList.remove('bg-activeNavBlue');
      }

      document.querySelectorAll('.subnav-item').forEach((sub) => {
        const subKey = sub.getAttribute('data-subnav');
        if (state.currentView === 'konsultasi' && state.konsultasiFilter === subKey) {
          sub.classList.add('bg-softSecondaryBg', 'font-bold', 'text-espresso');
        } else {
          sub.classList.remove('bg-softSecondaryBg', 'font-bold', 'text-espresso');
        }
      });

      const submenu = document.getElementById('konsultasi-submenu');
      const chevron = document.getElementById('konsultasi-chevron');
      if (state.submenuOpen) {
        submenu.classList.remove('hidden');
        chevron.style.transform = 'rotate(0deg)';
      } else {
        submenu.classList.add('hidden');
        chevron.style.transform = 'rotate(-90deg)';
      }
    }

    function toggleSubmenu() {
      state.submenuOpen = !state.submenuOpen;
      updateActiveNavStyles();
    }

    function toggleSidebar(forceState) {
      state.sidebarOpen = typeof forceState === 'boolean' ? forceState : !state.sidebarOpen;
      syncSidebarUI();
    }

    function closeSidebarMobile() {
      if (window.innerWidth < 1024) {
        state.sidebarOpen = false;
        syncSidebarUI();
      }
    }

    function syncSidebarUI() {
      const sidebar = document.getElementById('right-sidebar');
      const backdrop = document.getElementById('sidebar-backdrop');
      const chevron = document.getElementById('sidebar-toggle-chevron');
      const mainInner = document.getElementById('main-inner');
      const isDesktop = window.innerWidth >= 1024;

      const openWidthClasses = ['w-[86vw]', 'max-w-[320px]', 'sm:w-[325px]', 'lg:w-[305px]', 'xl:w-[330px]', 'lg:max-w-none'];
      const closedClasses = ['translate-x-full', 'lg:w-0', 'xl:w-0', 'lg:opacity-0', 'lg:pointer-events-none', 'lg:border-0'];

      if (state.sidebarOpen) {
        sidebar.classList.remove(...closedClasses);
        sidebar.classList.add('translate-x-0', ...openWidthClasses);
        if (mainInner) {
          mainInner.classList.remove('max-w-[1200px]');
          mainInner.classList.add('max-w-[1060px]');
        }
        if (!isDesktop) {
          backdrop.classList.remove('hidden');
        } else {
          backdrop.classList.add('hidden');
        }
        if (chevron) chevron.style.transform = 'rotate(0deg)';
      } else {
        sidebar.classList.remove('translate-x-0', ...openWidthClasses);
        sidebar.classList.add(...closedClasses);
        if (mainInner) {
          mainInner.classList.remove('max-w-[1060px]');
          mainInner.classList.add('max-w-[1200px]');
        }
        backdrop.classList.add('hidden');
        if (chevron) chevron.style.transform = 'rotate(180deg)';
      }
    }

    /* ==========================================================================
       4. MODAL & TOAST HELPERS
    ========================================================================== */
    let toastTimer = null;
    function showToast(message, icon = '✨') {
      const toast = document.getElementById('toast-banner');
      document.getElementById('toast-text').textContent = message;
      document.getElementById('toast-icon').textContent = icon;
      toast.classList.remove('hidden');
      toast.classList.add('flex');
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => {
        toast.classList.add('hidden');
        toast.classList.remove('flex');
      }, 3000);
    }

    function openModal(htmlContent) {
      document.getElementById('modal-content').innerHTML = htmlContent;
      const overlay = document.getElementById('modal-overlay');
      overlay.classList.remove('hidden');
      overlay.classList.add('flex');
    }

    function closeModal() {
      const overlay = document.getElementById('modal-overlay');
      overlay.classList.add('hidden');
      overlay.classList.remove('flex');
    }

                class="px-4 sm:px-5 py-2.5 rounded-full text-[14px] sm:text-[15px] font-heading font-bold text-espresso bg-cream border border-warmBorder disabled:opacity-40 hover:bg-softSecondaryBg/50 transition min-h-[44px]"

              ${state.currentQuestionIdx < ASSESSMENT_QUESTIONS.length - 1 ? `
                <button
                  onclick="nextAssessmentStep()"
                  class="px-5 sm:px-6 py-2.5 rounded-full text-[14px] sm:text-[15px] font-heading font-bold text-white bg-primaryBlue hover:bg-primaryBlueHover shadow-sm transition min-h-[44px]"

                  onclick="submitAssessment()"

      `;
    }

    function selectAssessmentOption(qId, score) {
      state.answers[qId] = score;
      renderCurrentView();
    }

    function prevAssessmentStep() {
      if (state.currentQuestionIdx > 0) {
        state.currentQuestionIdx--;
        renderCurrentView();
      }
    }

    function nextAssessmentStep() {
      const currentQ = ASSESSMENT_QUESTIONS[state.currentQuestionIdx];
      if (state.answers[currentQ.id] === undefined) {
        showToast('Pilih salah satu jawaban yang paling sesuai dulu ya 💙', '🌿');
        return;
      }
      state.currentQuestionIdx++;
      renderCurrentView();
    }

    function submitAssessment() {
      const currentQ = ASSESSMENT_QUESTIONS[state.currentQuestionIdx];
      if (state.answers[currentQ.id] === undefined) {
        showToast('Pilih jawaban terakhir terlebih dahulu ya 💙', '🌿');
        return;
      }

      const moodScore = Number(state.answers.mood || 0);
      let questionnaireSum = 0;
      for (let i = 1; i <= QUESTIONNAIRE_STATEMENTS.length; i++) {
        questionnaireSum += Number(state.answers[`q${i}`] || 0);
      }
      const questionnaireWeighted = (questionnaireSum / 80) * 70;
      const finalScore = Math.round(moodScore + questionnaireWeighted);

      let starExpression = 'bahagia';
      let categoryTitle = 'Bagus Banget!';
      let categoryDesc = 'Mood lagi cerah, pikiran stabil, dan ga banyak beban.';
      let badgeStyle = 'bg-softMintBg text-[#2C7A5B] border border-compMint';
      let tip = 'Pertahankan rutinitas baikmu hari ini, dan jangan lupa apresiasi diri sendiri karena sudah menjaga keseimbangan dengan baik.';

      if (finalScore >= 80) {
        starExpression = 'bahagia';
        categoryTitle = 'Bagus Banget!';
        categoryDesc = 'Mood lagi cerah, pikiran stabil, dan ga banyak beban.';
        badgeStyle = 'bg-softMintBg text-[#2C7A5B] border border-compMint';
        tip = 'Pertahankan rutinitas baikmu hari ini, dan jangan lupa apresiasi diri sendiri karena sudah menjaga keseimbangan dengan baik.';
      } else if (finalScore >= 60) {
        starExpression = 'senang';
        categoryTitle = 'Bagus Aja.';
        categoryDesc = 'Mood masih terbilang oke, wajar kalau ada capek dikit tapi terkendali.';
        badgeStyle = 'bg-softBlueBg text-primaryBlue border border-primaryBlue/25';
        tip = 'Tetap beri jeda istirahat ringan di sela aktivitasmu supaya rasa capek tidak menumpuk.';
      } else if (finalScore >= 40) {
        starExpression = 'flat';
        categoryTitle = 'Agak Ga Bagus.';
        categoryDesc = 'Lagi lumayan banyak pikiran, capek fisik atau mental, butuh jeda bentar.';
        badgeStyle = 'bg-softYellowBg text-[#9B6B0C] border border-compYellow';
        tip = 'Coba tarik napas sejenak, kurangi beban aktivitas yang tidak mendesak, atau kunjungi tempat healing yang tenang.';
      } else {
        starExpression = 'sedih';
        categoryTitle = 'Ga Bagus.';
        categoryDesc = 'Mood lagi bener-bener drop, kewalahan, butuh banget istirahat dan healing sejenak.';
        badgeStyle = 'bg-softSecondaryBg text-[#9E5E31] border border-secondaryTerracotta/40';
        tip = 'Kamu tidak harus memikul semuanya sendirian. Istirahat dulu sejenak, dan pertimbangkan ngobrol dengan konselor atau psikolog agar terasa lebih lega.';
      }

      state.answers = {};
      state.currentQuestionIdx = 0;
      renderCurrentView();

      openModal(`
        <div class="text-center">
          <div class="w-28 h-28 sm:w-32 sm:h-32 mx-auto mb-2 animate-gentle-float">
            ${getStarExpressionSVG(starExpression)}
          </div>
          <span class="inline-block px-3.5 py-1 rounded-full text-[13px] font-heading font-bold ${badgeStyle} mb-2">
            Skor Akhir ${finalScore}/100
          </span>
          <h3 class="rod-sub-judul mb-2">${categoryTitle}</h3>
          <p class="rod-body-text text-espresso mb-4">${categoryDesc}</p>
          <div class="bg-softBlueBg/80 border border-primaryBlue/15 rounded-2xl p-4 text-left text-[14.5px] sm:text-[15px] text-espresso mb-5">
            <strong class="block font-heading font-bold mb-1">💡 Saran Lembut Untukmu:</strong>
            ${tip}

                      </div>
                      <div class="bg-softBlueBg/55 border border-primaryBlue/15 rounded-xl px-3.5 py-2.5 text-[13.5px] text-espresso/90 leading-relaxed">
                        <strong>Catatan:</strong> ${item.note}
                      </div>
                    </div>
                  `).join('')}
                </div>
              </div>
            ` : ''}
          </div>
        </div>
      `;
    }

    /* -------------------- VIEW 4: REKOMENDASI TEMPAT HEALING -------------------- */

    function renderTempatHealingView() {
      const areas = [
        'Semua',
        'Bandung Pusat',
        'Bandung Utara',
        'Bandung Timur',
        'Bandung Selatan',
        'Bandung Barat & Cimahi'
      ];

      const filtered = HEALING_PLACES.filter(p => {
        const matchArea =
          state.healingAreaFilter === 'Semua'
            ? true
            : p.area === state.healingAreaFilter;
        const q = state.healingSearch.toLowerCase();
        const matchSearch =
          !q ||
          p.name.toLowerCase().includes(q) ||
          p.location.toLowerCase().includes(q) ||
          p.tag.toLowerCase().includes(q) ||
          p.vibes.toLowerCase().includes(q) ||
          p.cocokBuat.toLowerCase().includes(q);
        return matchArea && matchSearch;
      });

      const accentBadge = {
        blue: 'bg-softBlueBg text-primaryBlue',
        terracotta: 'bg-softSecondaryBg text-[#9E5E31]',
        mint: 'bg-softMintBg text-[#2C7A5B]',
        yellow: 'bg-softYellowBg text-[#9B6B0C]'
      };

      return `
        <div class="view-enter">
          <div class="mb-5 sm:mb-6">
            <button onclick="navigateTo('beranda')" class="inline-flex items-center gap-1.5 text-[14px] font-bold text-primaryBlue hover:underline mb-1.5 py-1">
              ← Kembali ke Beranda
            </button>
            <h1 class="rod-judul-besar">Rekomendasi Tempat Healing</h1>
            <p class="font-hand text-[19px] sm:text-[21px] text-mutedBrown mt-0.5">22 sudut nyaman di Bandung dan sekitarnya untuk menarik napas dan menenangkan pikiran ♡</p>
          </div>

          <!-- Area Filter + Search Bar -->
          <div class="flex flex-col gap-3.5 mb-6">
            <div class="flex flex-wrap gap-2">
              ${areas.map(area => {
                const active = state.healingAreaFilter === area;
                return `
                  <button
                    onclick="setHealingAreaFilter('${area}')"
                    class="px-3.5 sm:px-4 py-2 rounded-full text-[13.5px] sm:text-[14.5px] font-heading font-bold transition min-h-[40px] ${
                      active
                        ? 'bg-primaryBlue text-white shadow-sm'
                        : 'bg-creamCard border border-warmBorder text-espresso hover:bg-softBlueBg/70'
                    }"
                  >
                    ${area}
                  </button>
                `;
              }).join('')}
            </div>

            <div class="relative w-full sm:w-80">
              <input
                type="text"
                value="${state.healingSearch}"
                oninput="setHealingSearch(this.value)"
                placeholder="Cari nama tempat, buku, pinus, gratis..."
                class="w-full pl-9 pr-4 py-2.5 rounded-full bg-creamCard border border-warmBorder text-[16px] sm:text-[14.5px] text-espresso placeholder:text-mutedBrown/60 focus:outline-none focus:border-primaryBlue"
              />
              <svg class="w-4 h-4 text-mutedBrown absolute left-3.5 top-3.5 sm:top-3" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <circle cx="11" cy="11" r="8"></circle>
                <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
              </svg>
            </div>
          </div>

          <div class="grid grid-cols-1 md:grid-cols-2 gap-4 sm:gap-5">
            ${filtered.map(place => {
              return `
                <div class="bg-creamCard border border-warmBorder rounded-[24px] p-5 shadow-softCard flex flex-col justify-between">
                  <div>
                    <div class="relative mb-3.5 sm:mb-4">
                      ${getPlaceIllustration(place.sceneType)}
                    </div>

                    <div class="flex flex-wrap items-center gap-2 mb-2">
                      <span class="px-2.5 py-0.5 rounded-full text-[12px] font-heading font-bold ${accentBadge[place.accent]}">
                        ${place.area}
                      </span>
                      <span class="px-2.5 py-0.5 rounded-full text-[12px] font-heading font-bold bg-cream border border-warmBorder text-mutedBrown">
                        ${place.tag}
                      </span>
                    </div>

                    <h3 class="font-heading font-bold text-[18.5px] sm:text-[19.5px] text-espresso leading-snug">${place.name}</h3>
                    <p class="text-[13.5px] sm:text-[14px] text-primaryBlue font-bold mt-1">📍 ${place.location}</p>
                    <p class="text-[13.5px] sm:text-[14px] text-espresso mt-1"><strong>💰 Bujet:</strong> ${place.budget}</p>

                    <div class="mt-3 space-y-2 text-[14px] sm:text-[14.5px] text-mutedBrown leading-relaxed">
                      <p><strong class="text-espresso">✨ Vibes-nya:</strong> ${place.vibes}</p>
                      <p><strong class="text-espresso">🌿 Cocok buat:</strong> ${place.cocokBuat}</p>
                    </div>
                  </div>

                  <div class="mt-4 pt-3.5 border-t border-warmBorder flex items-center justify-between gap-2">
                    <a
                      href="${place.mapsUrl}"
                      target="_blank"
                      rel="noopener noreferrer"
                      class="w-full sm:w-auto inline-flex items-center justify-center gap-1.5 px-4 py-2.5 sm:py-2 rounded-full bg-primaryBlue hover:bg-primaryBlueHover text-white font-heading font-bold text-[13.5px] shadow-sm transition min-h-[40px]"
                    >
                      <span>Buka di Google Maps</span>
                      <span>↗</span>
                    </a>
                  </div>
                </div>
              `;
            }).join('')}
          </div>

          ${filtered.length === 0 ? `
            <div class="text-center py-12 px-4 bg-creamCard rounded-[24px] border border-warmBorder">
              <p class="font-heading font-bold text-[18px] sm:text-[19px] text-espresso">Belum ada tempat healing yang cocok dengan filtermu</p>
              <button onclick="resetHealingFilters()" class="mt-3 px-5 py-2.5 rounded-full bg-primaryBlue text-white text-[14px] font-bold min-h-[42px]">
                Tampilkan Semua Tempat
              </button>
            </div>
          ` : ''}
        </div>
      `;
    }

    function setHealingAreaFilter(area) {
      state.healingAreaFilter = area;
      renderCurrentView();
    }

    function setHealingSearch(val) {
      state.healingSearch = val;
      renderCurrentView();
    }

    function resetHealingFilters() {
      state.healingAreaFilter = 'Semua';
      state.healingSearch = '';
      renderCurrentView();
    }

    /* -------------------- VIEW 5: REKOMENDASI BUKU -------------------- */
    function renderBukuView() {
      const categories = [
        'Semua',
        'Pengembangan Diri',
        'Filsafat & Psikologi Populer',
        'Esai Reflektif',
        'Prosa & Puisi'
      ];

      const filtered = BOOKS.filter(b => {
        if (state.bookFilter === 'Semua') return true;
        return b.category === state.bookFilter;
      });

      const coverStyles = {
        blue: { box: 'bg-softBlueBg border-primaryBlue/30', stroke: '#3E8EDE', badge: 'bg-softBlueBg text-primaryBlue', quote: 'border-primaryBlue' },
        terracotta: { box: 'bg-softSecondaryBg border-secondaryTerracotta/35', stroke: '#C98A5A', badge: 'bg-softSecondaryBg text-[#9E5E31]', quote: 'border-secondaryTerracotta' },
        mint: { box: 'bg-softMintBg border-compMint', stroke: '#3A9672', badge: 'bg-softMintBg text-[#2C7A5B]', quote: 'border-compMint' },
        yellow: { box: 'bg-softYellowBg border-compYellow', stroke: '#C58B16', badge: 'bg-softYellowBg text-[#9B6B0C]', quote: 'border-compYellow' }
      };

      return `
        <div class="view-enter">
          <div class="mb-5 sm:mb-6">
            <button onclick="navigateTo('beranda')" class="inline-flex items-center gap-1.5 text-[14px] font-bold text-primaryBlue hover:underline mb-1.5 py-1">
              ← Kembali ke Beranda
            </button>
            <h1 class="rod-judul-besar">Rekomendasi Buku</h1>
            <p class="font-hand text-[19px] sm:text-[21px] text-mutedBrown mt-0.5">Bacaan hangat yang menemanimu bertumbuh perlahan ♡</p>
          </div>

          <div class="flex flex-wrap gap-2 mb-6">
            ${categories.map(cat => {
              const active = state.bookFilter === cat;
              return `
                <button
                  onclick="setBookFilter('${cat}')"
                  class="px-3.5 sm:px-4 py-2 rounded-full text-[13.5px] sm:text-[14.5px] font-heading font-bold transition min-h-[40px] ${
                    active
                      ? 'bg-primaryBlue text-white shadow-sm'
                      : 'bg-creamCard border border-warmBorder text-espresso hover:bg-softBlueBg/70'
                  }"
                >
                  ${cat}
                </button>
              `;
            }).join('')}
          </div>

          <div class="grid grid-cols-1 md:grid-cols-2 gap-4 sm:gap-5">
            ${filtered.map((book, idx) => {
              const style = coverStyles[book.accent];
              return `
                <div class="bg-creamCard border border-warmBorder rounded-[24px] p-5 sm:p-6 shadow-softCard flex flex-col justify-between">
                  <div>
                    <div class="flex gap-3.5 sm:gap-4">
                      <div class="w-16 h-24 sm:w-20 sm:h-28 rounded-2xl ${style.box} border flex flex-col items-center justify-center p-2 text-center flex-shrink-0">
                        <svg class="w-7 h-7 sm:w-8 sm:h-8 mb-1" viewBox="0 0 32 32" fill="none" stroke="${style.stroke}" stroke-width="2.2" stroke-linecap="round">
                          <path d="M6 7H24V25H6V7Z" />
                          <line x1="10" y1="7" x2="10" y2="25" />
                          <line x1="14" y1="13" x2="20" y2="13" />
                          <line x1="14" y1="17" x2="19" y2="17" />
                        </svg>
                        <span class="rod-note-text font-bold uppercase tracking-wider text-espresso/85">Buku #0${idx + 1}</span>
                      </div>

                      <div class="flex-1 min-w-0">
                        <span class="inline-block px-2.5 py-0.5 rounded-full text-[11.5px] font-heading font-bold ${style.badge} mb-1">
                          ${book.category}
                        </span>
                        <h3 class="font-heading font-bold text-[18px] sm:text-[19px] text-espresso leading-snug">
                          ${book.title}
                        </h3>
                        <p class="text-[13.5px] sm:text-[14px] font-bold text-primaryBlue mt-0.5">oleh ${book.author}</p>
                        <p class="text-[12px] sm:text-[12.5px] text-mutedBrown mt-1">📚 ${book.bookType}</p>
                      </div>
                    </div>

                    <div class="bg-cream border-l-4 ${style.quote} rounded-r-xl px-3.5 py-2.5 mt-4 text-[13.5px] sm:text-[14px] text-espresso">
                      <strong>Tema Besar:</strong> ${book.theme}
                    </div>

                    <p class="text-[14.5px] sm:text-[15px] text-mutedBrown leading-relaxed mt-3">
                      <strong class="text-espresso">Sinopsis:</strong> ${book.synopsis}
                    </p>
                  </div>
                </div>
              `;
            }).join('')}
          </div>
        </div>
      `;
    }

    function setBookFilter(cat) {
      state.bookFilter = cat;
      renderCurrentView();
    }
  </script>
</body>
